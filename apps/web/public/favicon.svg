<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3F8F" />
      <stop offset="60%" stop-color="#213272" />
      <stop offset="100%" stop-color="#182352" />
    </linearGradient>
    <linearGradient id="gulalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F06292" />
      <stop offset="60%" stop-color="#E0527F" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" />

  <!-- Calibration ring -->
  <circle cx="24" cy="24" r="20" stroke="#FAF4E8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 3" />

  <!-- International Diabetes Federation Blue Circle -->
  <circle cx="24" cy="24" r="16.5" stroke="#FAF4E8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Glycemic Orbit Dot (Haldi / Saffron) -->
  <circle cx="37" cy="15" r="2.5" fill="#E8A33D" />

  <!-- Glucose Drop (Gulal Pink) -->
  <path d="M24 11C24 11 15 21.5 15 26.5C15 31.47 19.03 35.5 24 35.5C28.97 35.5 33 31.47 33 26.5C33 21.5 24 11 24 11Z" fill="url(#gulalGrad)" />

  <!-- Wheat grain & pulse convergence glyph -->
  <path d="M24 16V31M21 21L24 23.5L27 21M21 25.5L24 28L27 25.5" stroke="#FAF4E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Light micro-reflection -->
  <ellipse cx="21" cy="24" rx="2" ry="4" fill="#FAF4E8" fill-opacity="0.25" transform="rotate(-25 21 24)" />
</svg>
