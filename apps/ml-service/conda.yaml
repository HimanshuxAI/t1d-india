# Conda Environment for T1D India ML Service

name: t1d-ml
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Core ML
  - python=3.11
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=11.8
  - cudatoolkit=11.8
  
  # Data processing
  - numpy=1.24.3
  - pandas=2.0.3
  - scipy=1.11.1
  - scikit-learn=1.3.0
  
  # MLflow & Experiment tracking
  - mlflow=2.12.0
  - pyyaml=6.0.1
  
  # ONNX
  - onnx=1.15.0
  - onnxruntime=1.16.0
  - onnxruntime-gpu=1.16.0
  
  # Hyperparameter optimization
  - optuna=3.4.0
  
  # Data processing
  - pyarrow=12.0.1
  - fastparquet=2023.6.0
  
  # ML utilities
  - tqdm=4.66.1
  - tensorboard=2.14.0
  
  # Image processing (for carb estimation)
  - pillow=10.0.0
  - opencv=4.8.1
  
  # Audio processing (for voice)
  - librosa=0.10.1
  - torchaudio=2.1.0
  
  # NLP (for voice processing)
  - transformers=4.33.0
  - tokenizers=0.13.3
  
  # OCR
  - pytesseract=0.3.10
  - tesseract=5.3.3
  
  # Utilities
  - requests=2.31.0
  - aiohttp=3.8.5
  - python-dotenv=1.0.0
  
  # Testing
  - pytest=7.4.2
  - pytest-cov=4.1.0
  - pytest-asyncio=0.21.1
  
  - pip:
    - fastapi==0.103.0
    - uvicorn[standard]==0.23.2
    - pydantic==2.4.2
    - pydantic-settings==2.0.3
    - python-multipart==0.0.6
    - python-jose[cryptography]==3.3.0
    - passlib[bcrypt]==1.7.4
    - redis==5.0.0
    - prometheus-client==0.17.1
    - structlog==23.2.0
    - mlflow-skinny==2.12.0  # Lightweight MLflow client
    
    # Indian language support
    - indic-nlp-library==1.0.4
    - indic-transliteration==1.1.3
    
    # OCR language packs
    - tesseract-lang-hin
    - tesseract-lang-eng