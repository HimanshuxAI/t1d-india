global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 't1d-india'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API service metrics
  - job_name: 't1d-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'

  # ML service metrics
  - job_name: 't1d-ml'
    static_configs:
      - targets: ['ml:8000']
    metrics_path: '/metrics'

  # Node exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # PostgreSQL exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['host.docker.internal:9187']

  # Redis exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['host.docker.internal:9121']

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']