apiVersion: v1
kind: Service
metadata:
  name: {{ include "t1d-india.ml.fullname" . }}
  labels:
    {{- include "t1d-india.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml
spec:
  type: {{ .Values.ml.service.type }}
  ports:
    - port: {{ .Values.ml.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "t1d-india.ml.selectorLabels" . | nindent 4 }}