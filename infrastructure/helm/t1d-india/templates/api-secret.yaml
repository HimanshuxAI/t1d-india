apiVersion: v1
kind: Secret
metadata:
  name: {{ include "t1d-india.api.fullname" . }}-secrets
  labels:
    {{- include "t1d-india.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.postgresql.auth.database | default "t1d" }}
  REDIS_URL: redis://:{{ .Values.redis.auth.password }}@{{ include "t1d-india.redis.fullname" . }}:6379
  JWT_SECRET: {{ .Values.api.jwtSecret | default "" }}
  CLERK_SECRET_KEY: {{ .Values.api.clerkSecretKey | default "" }}
  CLERK_WEBHOOK_SECRET: {{ .Values.api.clerkWebhookSecret | default "" }}
  DEXCOM_CLIENT_ID: {{ .Values.api.dexcomClientId | default "" }}
  DEXCOM_CLIENT_SECRET: {{ .Values.api.dexcomClientSecret | default "" }}
  DEXCOM_REDIRECT_URI: {{ .Values.api.dexcomRedirectUri | default "" }}
  LIBRE_CLIENT_ID: {{ .Values.api.libreClientId | default "" }}
  LIBRE_CLIENT_SECRET: {{ .Values.api.libreClientSecret | default "" }}
  ML_SERVICE_URL: http://{{ include "t1d-india.ml.fullname" . }}:{{ .Values.ml.service.port }}
  ML_SERVICE_API_KEY: {{ .Values.ml.apiKey | default "" }}
  S3_ENDPOINT: http://{{ include "t1d-india.minio.fullname" . }}:9000
  S3_ACCESS_KEY: {{ .Values.minio.accessKey | default "" }}
  S3_SECRET_KEY: {{ .Values.minio.secretKey | default "" }}
  SENTRY_DSN: {{ .Values.api.sentryDsn | default "" }}