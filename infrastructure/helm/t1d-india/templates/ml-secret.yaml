apiVersion: v1
kind: Secret
metadata:
  name: {{ include "t1d-india.ml.fullname" . }}-secrets
  labels:
    {{- include "t1d-india.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml
type: Opaque
stringData:
  ML_SERVICE_API_KEY: {{ .Values.ml.apiKey | default "" }}
  MODEL_PATH: /models
  HYPO_MODEL_NAME: {{ .Values.ml.hypoModelName | default "tft_hypo_predictor.onnx" }}
  CARB_MODEL_NAME: {{ .Values.ml.carbModelName | default "carb_estimator.onnx" }}